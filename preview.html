  <style>
    main {
      padding: 32px;
    }

    .logo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: auto;
      column-gap: 18px;
      border: 2px solid var(--vp-c-gray-1);
      border-radius: 12px;
      overflow: hidden;
    }

    .logo-grid__logo {
      padding: 16px;
      font-size: 14px;

      display: flex;
      justify-content: space-between;
    }

    .logo-grid__logo:nth-of-type(odd) {
      background-color: rgb(255, 255, 255);
      color: rgb(27, 27, 31);
    }

    .logo-grid__logo:nth-of-type(even) {
      background-color: rgb(27, 27, 31);
      color: rgb(255, 255, 255);
    }
  </style>
